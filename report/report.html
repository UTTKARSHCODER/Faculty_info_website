<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>REPORT PAGE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="Style.css">
<!--header-->
<div class="container" style="width: 600px; height: 950px; ">
    <div class="heading">
        <h1 style="font-size: 30px;"><b>REPORT AN ISSUE</b></h1>
    </div>
    <!--FORM STARTED-->
    <form>
        <label id="name mt-5"  style="font-size: 20px;"><b>YOUR NAME</b></label><br>
        <input  type="text" placeholder="ENTER YOUR NAME" class="name" style="width: 400px; height: 40px;  font-size: 20px; text-align: center;
    color: whitesmoke; background: linear-gradient(to right, #283048, #859398); font-style: italic;" required><br>
        <!--MAIL BOX-->
         <label id="mail mt-5" style="font-size: 20px; margin-top: 10px;"><b>YOUR MAIL</b></label><br>
        <input  type="text" placeholder="ENTER YOUR MAIL" class="mail" style="width: 400px; height: 40px;  font-size: 20px; text-align: center;
    color: whitesmoke; background: linear-gradient(to right, #283048, #859398); font-style: italic;" required><br>
        <!--department box-->
         <label id="dept mt-5"  style=" font-size: 20px; margin-top: 20px;"><b>ENTER YOUR DEPARTMENT</b></label><br>
        <select style=" text-align: center; font-style: italic; color:white; margin-top: 10px; height: 40PX; width: 400PX; background:linear-gradient(to right, #283048, #859398) ;">
            <option value="" style="color: black;" ><b>SELECT YOUR DEPARTMENT</b></option>
            <option value="CSE" style="color: black;">CSE</option>
            <option value="CE" style="color: black;">CE</option>
            <option value="ME" style="color: black;">ME</option>
            <option value="AI" style="color: black;">ECE</option>
            <option value="DS" style="color: black;">EE</option>
            <option value="AI" style="color: black;">IT</option>
           
        </select>
        <br>     
        <!--ISSUE BOX-->
        <label id="issue mt-5" style="font-size: 20px; margin-top: 20px;"><b>DESCRIPTION OF ISSUE</b></label><br>
        <textarea type="text" placeholder="WRITE YOUR ISSUE HERE" rows="5" class="issue" style="width: 400px; background:linear-gradient(to right, #283048, #859398); font-style: italic; color:white" required></textarea><br>
        <!--SCREENSHOT UPLOAD-->
        <label id="img mt-5" style="font-size: 20px; margin-top: 20px;"><b>UPLOAD THE SCREENSHOT OF ISSUE</b></label><br>
        <input type="file" placeholder="UPLOAD THE SS OF ISSUE" class="img" style="margin-top: 20px; height:40px; font-size: 20px; text-align: center; font-style: italic; " upload><br>
        <!--SUBMIT BUTTON-->
        <button type="submit" class="button" style="margin-left: 100px; margin-top: 40px; width:200px; height: 40px; background:linear-gradient(to right, #283048, #859398); color: white;">SUBMIT</button>
        
    
        

    </form>
</div>
