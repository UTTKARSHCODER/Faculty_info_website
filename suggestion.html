<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Suggestion page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" text = 'text/css' media = 'screen' href="assets/css/suggestion_style.css">
</head>
<body>
    <div class="container mt-3 p-3">
    <div class="text">   
        <h1 style="font-size: 50px; text-align: center;"><b>Suggestion Page</b></h1>
    </div>
    <div class="form">
        <form class="form mt-5">
        <h2><b>GIVE YOUR SUGGESTION</b></h2>
        <br>
        <!-- NAME BOX-->
        <label class="name"><b>YOUR NAME</b></label><br>
        <input type="text" placeholder="ENTER YOUR NAME" id="name" style="width: 400px; height: 40px; font-size: 20px; text-align: center;
            color: whitesmoke; background: linear-gradient(to right, #283048, #859398); font-style: italic;" required>
        <br>
        <!-- MAIL BOX-->
        <label class="mail mt-5 "><b>YOUR EMAIL</b></label><br>
        <input type="text" placeholder="ENTER YOUR EMAIL" id="mail" style="width: 400px; height: 40px; text-align: center;
            color: whitesmoke; background: linear-gradient(to right, #283048, #859398); font-size: 20px; font-style: italic;" required>
        <br>
        <!-- DEPARTMENT BOX-->
        <label class="department mt-5 text-black"><b>YOUR DEPARTMENT</b></label><br>
        <select class="department" style="width: 400px; height: 40px;  font-size: 20px; text-align: center;
            color: whitesmoke; background: linear-gradient(to right, #283048, #859398); font-style: italic;" required>
            <option value="" style="color: black;">SELECT YOUR DEPARTMENT</option>
            <option value="CSE" style="color: black;">CSE</option>
            <option value="AI" style="color: black;">AI</option>
            <option value="DS" style="color: black;">DS</option>
            <option value="CE" style="color: black;">CE</option>
            <option value="ECE" style="color: black;">ECE</option>
            <option value="ME" style="color: black;">ME</option>
            <option value="IT"style="color: black;">IT</option>
        </select>
        <br>
        <!-- SUGGESTION BOX-->
        <label class="sugg mt-5 "><b>ENTER YOUR SUGGESTION</b></label><br>
        <br>
        <textarea class="sugg"  placeholder="........WRITE SUGGESTION HERE......." rows="5" style=" color:white; width: 600px; height:150px;  text-align: center;  background: linear-gradient(to right, #283048, #859398); font-size: 20px; color:azure; font-style: italic;" required></textarea>
        <br>
        <div class="submit">
        <button type="submit" class="btn" style=" width: 150px; height: 40px; text-align: center; color :white;  background: linear-gradient(to right, #283048, #859398);"><b>SUBMIT</b></button>
</div>
</div>
</div>
</form>
</body>
</html>
